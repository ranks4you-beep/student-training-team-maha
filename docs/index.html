ontent"></div><div class="foot" data-i18n="تُحفظ السجلات في مساحة الفريق المشتركة، وتظهر التحديثات لجميع الأعضاء.">تُحفظ السجلات في مساحة الفريق المشتركة، وتظهر التحديثات لجميع الأعضاء.</div></main></div><dialog id="modal"><div id="modalBody"></div></dialog><script src="./assets/pages-runtime.js"></script><script>if(!trainingHasSession())location.replace(trainingPage("login.html"));</script><script src="./assets/i18n.js"></script><script src="./assets/auth-shared.js"></script><script>
let M={},events=[],tasks=[],users=[],view='dashboard',month=new Date(2026,9,1),calendarMode='month',filterPath='all',selectedDay='2026-10-26';const $=s=>document.querySelector(s);const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));const iso=d=>ui`${d.getFullYear()}-${('0'+(d.getMonth()+1)).slice(-2)}-${('0'+d.getDate()).slice(-2)}`;const local=s=>new Date(s+'T12:00:00');const plus=(s,n)=>{let d=local(s);d.setDate(d.getDate()+n);return iso(d)};const pname=id=>tr(M.programs.find(p=>p.id==id)?.name||'');const pathOf=id=>M.programs.find(p=>p.id==id)?.path_id;const pathName=id=>tr(M.paths.find(p=>p.id==id)?.name||'');const palettes=['#dbeafe','#def4e7','#eee4fa','#fff0d5'];const q=(val)=>encodeURIComponent(val);const option=(v,label,selected,translate=true)=>ui`<option value="${esc(v)}" ${String(v)===String(selected)?'selected':''}>${esc(translate?tr(label):label)}</option>`;
let currentUser=null,csrfToken='',team=[],workspaceRevision=null;
async function api(url,method='GET',body){return trainingApi('/api'+url,method,body);}
async function reload(){
  const [identity,revision]=await Promise.all([api('/auth/me'),api('/workspace/revision')]);
  currentUser=identity.user;csrfToken=identity.csrf_token;
  const next=await Promise.all([api('/meta'),api('/events'),api('/tasks'),isLeader()?api('/users'):Promise.resolve([]),api('/team')]);
  if(workspaceRevision!==null&&revision.revision<workspaceRevision)return;
  [M,events,tasks,users,team]=next;workspaceRevision=revision.revision;
  syncAuthShell();render();
}
function navigate(v){if(!M.programs)return;if(v==='users'&&!isLeader())v='dashboard';view=v;$('#nav').querySelectorAll('button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));render()}
$('#nav').addEventListener('click',e=>{let b=e.target.closest('[data-view]');if(b)navigate(b.dataset.view)});
function setContent(html,title){$('#heading').textContent=tr(title);$('#content').innerHTML=html;applyPermissions()}
function card(label,n){return ui`<div class="stat"><strong>${n}</strong><span class="tiny">${esc(tr(label))}</span></div>`}
function status(s){return ui`<span class="tag ${s==='مغلقة'||s==='مكتمل'?'success':s==='منتهية'?'warning':''}">${esc(tr(s))}</span>`}
function selectionPaths(sel='all',all=true){return ui`<select id="filterPath" onchange="filterPath=this.value;render()">${all?option('all','جميع المسارات',sel):''}${M.paths.map(p=>option(p.id,p.name,sel)).join('')}</select>`}
function dashboard(){let ended=events.filter(e=>['منتهية','مغلقة'].includes(e.status));let overdue=tasks.filter(t=>t.status!=='مكتمل'&&t.due<iso(new Date()));setContent(ui`<div class="stats">${card('المسارات المعتمدة',4)}${card('البرامج المعتمدة',16)}${card('الفعاليات المسجلة',events.length)}${card('المهام المتأخرة',overdue.length)}</div><div class="grid2" style="margin-top:16px"><section class="card"><h3>الفعاليات حسب المسار</h3>${M.paths.map(p=>ui`<div class="row entry"><span>${esc(tr(p.name))}</span><b>${eventCount(events.filter(e=>pathOf(e.program_id)===p.id).length)}</b></div>`).join('')}</section><section class="card"><h3>متابعة التنفيذ</h3><div class="entry">فعاليات منتهية أو مغلقة: <b>${ended.length}</b></div><div class="entry">فعاليات مجدولة: <b>${events.filter(e=>e.status==='مجدولة').length}</b></div><div class="entry">مهام تحت العمل: <b>${tasks.filter(t=>t.status==='تحت العمل').length}</b></div><div class="row"><button class="btn" onclick="navigate('calendar')">عرض التقويم</button><button class="btn secondary" onclick="navigate('documents')">متابعة الملفات</button></div></section></div>`,'لوحة القيادة')}
function calendar(){let first=new Date(month.getFullYear(),month.getMonth(),1,12),start=new Date(first);start.setDate(1-first.getDay());let dates=calendarMode==='month'?Array.from({length:42},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);return iso(d)}):Array.from({length:7},(_,i)=>plus(selectedDay,-local(selectedDay).getDay()+i));let records=events.filter(e=>filterPath==='all'||pathOf(e.program_id)==filterPath);let heads=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'].map(x=>ui`<div class="cal-head">${tr(x)}</div>`).join('');let cells=dates.map(d=>{let es=records.filter(e=>e.sessions.includes(d));return ui`<button class="day" onclick="selectedDay='${d}';render()" style="${d===selectedDay?'border:2px solid #3b83c3;':''}"><small>${Number(d.slice(8))}</small>${es.slice(0,3).map(e=>ui`<div class="event-pill" style="background:${palettes[(pathOf(e.program_id)-1)%4]}">${esc(e.name)}</div>`).join('')}${es.length>3?translateUI('<small>+ المزيد</small>'):''}</button>`}).join('');let dayEvents=records.filter(e=>e.sessions.includes(selectedDay));setContent(ui`<div class="controls"><div class="field"><label>المسار</label>${selectionPaths(filterPath)}</div><div class="field"><label>عرض التقويم</label><select onchange="calendarMode=this.value;render()">${option('month','شهري',calendarMode)}${option('week','أسبوعي',calendarMode)}</select></div><button class="btn" onclick="eventForm()">+ فعالية جديدة</button></div><section class="card"><div class="row" style="margin-bottom:15px"><div><button class="small-btn" onclick="moveMonth(-1)">السابق</button> <button class="small-btn" onclick="moveMonth(1)">التالي</button></div><b>${new Intl.DateTimeFormat(currentLocale(),{month:'long',year:'numeric'}).format(month)}</b></div><div class="cal">${heads}${cells}</div></section><section class="card"><h3>لقاءات ${selectedDay}</h3>${dayEvents.length?dayEvents.map(e=>ui`<div class="entry row"><div><b>${esc(e.name)}</b><div class="tiny">${esc(pname(e.program_id))} | ${e.time_start} – ${e.time_end}</div></div><button class="small-btn" onclick="eventDetails('${e.id}')">فتح</button></div>`).join(''):translateUI('<span class="muted">لا توجد لقاءات في هذا اليوم.</span>')}</section>`,'التقويم الفصلي')}
function moveMonth(n){if(calendarMode==='month'){month.setMonth(month.getMonth()+n)}else selectedDay=plus(selectedDay,n*7);render()}
function eventsView(){let r=events.filter(e=>filterPath==='all'||pathOf(e.program_id)==filterPath);setContent(ui`<div class="controls"><div class="field"><label>تصفية المسار</label>${selectionPaths(filterPath)}</div><button class="btn" onclick="eventForm()">+ إضافة فعالية</button></div><section class="card tablewrap"><table><thead><tr><th>الفعالية</th><th>البرنامج</th><th>الفترة</th><th>اللقاءات</th><th>الحالة</th><th></th></tr></thead><tbody>${r.map(e=>ui`<tr><td><b>${esc(e.name)}</b><div class="tiny">${esc(e.owner)}</div></td><td>${esc(pname(e.program_id))}</td><td>${e.start} إلى ${e.end}</td><td>${e.sessions.length}</td><td>${status(e.status)}</td><td><button class="small-btn" onclick="eventDetails('${e.id}')">التفاصيل</button></td></tr>`).join('')}</tbody></table>${!r.length?translateUI('<p class="muted">لم تُسجل فعاليات بعد.</p>'):''}</section>`,'الدورات والفعاليات')}
function modal(html){$('#modalBody').innerHTML=html;$('#modal').showModal();applyPermissions()}function closeModal(){$('#modal').close()}
function eventForm(id){let e=events.find(x=>x.id===id)||{name:'',program_id:101,start:selectedDay,end:selectedDay,schedule:'single',days:[0,2],custom_dates:[],time_start:'16:00',time_end:'18:00',owner:'',status:'مجدولة'};modal(ui`<h3>${tr(id?'تعديل الفعالية':'إضافة فعالية')}</h3><form id="eventForm" onsubmit="submitEvent(event,'${id||''}')"><div class="grid2"><div><label>اسم الفعالية</label><input name="name" required value="${esc(e.name)}"></div><div><label>البرنامج المعتمد</label><select name="program_id">${M.paths.map(p=>ui`<optgroup label="${esc(tr(p.name))}">${M.programs.filter(x=>x.path_id===p.id).map(pr=>option(pr.id,pr.name,e.program_id)).join('')}</optgroup>`).join('')}</select></div><div><label>تاريخ البداية</label><input name="start" type="date" required value="${e.start}"></div><div><label>تاريخ النهاية</label><input name="end" type="date" required value="${e.end}"></div><div><label>نمط الجدولة</label><select name="schedule" onchange="scheduleFields()">${[['single','يوم واحد'],['consecutive','أيام متتالية'],['weekly','لقاءات أسبوعية'],['custom','مواعيد مخصصة']].map(p=>option(p[0],p[1],e.schedule)).join('')}</select></div><div><label>الحالة</label><select name="status">${M.statuses.filter(s=>s!=='مغلقة'||e.status==='مغلقة').map(s=>option(s,s,e.status)).join('')}</select></div><div><label>وقت البداية</label><input name="time_start" type="time" required value="${e.time_start}"></div><div><label>وقت النهاية</label><input name="time_end" type="time" required value="${e.time_end}"></div><div><label>المنسق</label><input name="owner" value="${esc(e.owner)}"></div></div><div id="weeklyBox"><label>أيام اللقاءات الأسبوعية</label><div class="days">${['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'].map((d,i)=>ui`<label><input class="check" type="checkbox" name="days" value="${i}" ${e.days.includes(i)?'checked':''}> ${tr(d)}</label>`).join('')}</div></div><div id="customBox"><label>تواريخ اللقاءات المخصصة (تاريخ في كل سطر)</label><textarea name="custom_dates" placeholder="2026-11-01&#10;2026-11-05">${(e.custom_dates||[]).join('\n')}</textarea></div><div class="controls" style="margin-top:17px"><button class="btn" type="submit">حفظ الفعالية</button><button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button></div></form>`);scheduleFields()}
function scheduleFields(){let s=$('#eventForm').elements.schedule.value;$('#weeklyBox').classList.toggle('hidden',s!=='weekly');$('#customBox').classList.toggle('hidden',s!=='custom')}
async function submitEvent(evt,id){evt.preventDefault();let f=evt.target;let v={name:f.elements.name.value,program_id:Number(f.elements.program_id.value),start:f.elements.start.value,end:f.elements.end.value,schedule:f.elements.schedule.value,days:[...f.querySelectorAll('input[name=days]:checked')].map(x=>Number(x.value)),custom_dates:f.elements.custom_dates.value.split(/\s+/).filter(Boolean),time_start:f.elements.time_start.value,time_end:f.elements.time_end.value,owner:f.elements.owner.value,status:f.elements.status.value};try{await api('/events'+(id?'/'+id:''),id?'PUT':'POST',v);closeModal();await reload()}catch(e){alert(e.message)}}
function eventDetails(id){let e=events.find(x=>x.id===id);modal(ui`<h3>${esc(e.name)}</h3><div class="entry">${esc(pathName(pathOf(e.program_id)))} ${language==='en'?'→':'←'} ${esc(pname(e.program_id))}</div><p>الفترة: ${e.start} – ${e.end} | ${esc(tr(e.status))}</p><p>المنسق: ${esc(e.owner||tr('غير محدد'))}</p><h3>اللقاءات (${e.sessions.length})</h3><div style="max-height:180px;overflow:auto">${e.sessions.map(d=>ui`<div class="entry">${d} | ${e.time_start} – ${e.time_end}</div>`).join('')}</div><div class="controls"><button class="btn" onclick="closeModal();eventForm('${e.id}')">تعديل</button><button class="btn secondary" onclick="closeModal();navigate('documents')">المرفقات</button><button class="btn danger" onclick="removeEvent('${e.id}')">حذف</button><button class="btn secondary" onclick="closeModal()">إغلاق</button></div>`)}
async function removeEvent(id){if(!confirm(tr('هل تريد حذف الفعالية نهائيًا؟')))return;try{await api('/events/'+id,'DELETE');closeModal();await reload()}catch(e){alert(e.message)}}
async function documents(){let ended=events.filter(e=>['منتهية','مغلقة'].includes(e.status));let results=await Promise.all(ended.map(e=>api('/documents/'+e.id)));setContent(ui`<section class="card"><h3>توثيق الفعاليات المنتهية</h3><p class="tiny">أضيفي روابط الملفات وراجعي حالة اعتمادها هنا. لا توجد مزامنة تلقائية مع OneDrive.</p>${ended.map((e,i)=>{let docs=results[i],present=docs.filter(d=>d.present).length,approved=docs.filter(d=>d.approved).length;return ui`<div class="entry"><div class="row"><b>${esc(e.name)}</b>${status(e.status)}</div><p class="tiny">المرفقات الموجودة: ${present}/4 | المعتمدة: ${approved}/4</p><div class="progress"><div style="width:${approved*25}%"></div></div><div style="margin-top:10px"><button class="small-btn" onclick="docDetails('${e.id}')">مراجعة المرفقات</button></div></div>`}).join('')}${!ended.length?translateUI('<p class="muted">لم تُحدد فعاليات منتهية بعد. حدّثي حالة إحدى الفعاليات إلى «منتهية» لتجربة التوثيق.</p>'):''}</section>`,'متابعة المرفقات')}
async function docDetails(id){let e=events.find(x=>x.id===id),docs=await api('/documents/'+id);modal(ui`<h3>مرفقات: ${esc(e.name)}</h3><p class="muted">تُحدّث حالة الملفات يدويًا من قِبل الفريق.</p>${docs.map((d,i)=>ui`<div class="entry"><div class="row"><b>${esc(tr(d.kind))}</b>${d.approved?status('مكتمل'):d.present?status('بانتظار الاعتماد'):status('ناقص')}</div><div class="controls"><label><input class="check" type="checkbox" id="p${i}" ${d.present?'checked':''} ${e.status==='مغلقة'?'disabled':''}> موجود</label><label><input class="check" type="checkbox" id="a${i}" ${d.approved?'checked':''} ${e.status==='مغلقة'?'disabled':''}> معتمد</label></div><input id="u${i}" placeholder="رابط الملف (اختياري)" value="${esc(d.url)}" ${e.status==='مغلقة'?'disabled':''}><button class="small-btn" ${e.status==='مغلقة'?'disabled':''} onclick="saveDoc('${id}',${i},'${q(d.kind)}')">حفظ حالة الملف</button></div>`).join('')}<div class="controls"><button class="btn" onclick="closeActivity('${id}')" ${e.status==='مغلقة'?'disabled':''}>اعتماد إغلاق الفعالية</button><button class="btn secondary" onclick="closeModal()">إغلاق</button></div>`)}
async function saveDoc(id,i,kind){try{await api('/documents/'+id+'/'+q(decodeURIComponent(kind)),'PUT',{present:$('#p'+i).checked,approved:$('#a'+i).checked,url:$('#u'+i).value});await docDetails(id)}catch(e){alert(e.message)}}
async function closeActivity(id){try{await api('/events/'+id+'/close','POST');closeModal();await reload()}catch(e){alert(e.message)}}
function tasksView(){
  const overdue=tasks.filter(task=>task.status!=='مكتمل'&&task.due<iso(new Date())).length;
  setContent(ui`<div class="stats">${card('إجمالي المهام',tasks.length)}${card('تحت العمل',tasks.filter(task=>task.status==='تحت العمل').length)}${card('مكتملة',tasks.filter(task=>task.status==='مكتمل').length)}${card('متأخرة',overdue)}</div><section class="card" style="margin-top:15px"><div class="row"><div><h3>مهام الفريق</h3><p class="tiny">${at('Tasks and linked events are visible to everyone in this workspace.')}</p></div><div class="controls"><button class="btn secondary shared-refresh" type="button" onclick="refreshSharedWork()">${at('Refresh')}</button><button class="btn" onclick="taskForm()">+ ${at('New task')}</button></div></div><p id="workspaceSyncStatus" class="tiny" role="status">${at('Updates automatically while this page is open.')}</p>${tasks.map(task=>{
    const linked=events.find(event=>event.id===task.event_id);
    const owner=task.assignee_name||task.owner||at('Unassigned');
    return ui`<article class="entry task-entry" data-task-id="${esc(task.id)}"><div class="row"><b class="task-title">${esc(task.title)}</b><div class="account-tags">${task.assignee_id===currentUser.id?ui`<span class="tag success">${at('Assigned to you')}</span>`:''}${status(task.status)}</div></div><div class="tiny task-meta">${at('Assigned to')}: <b>${esc(owner)}</b> · ${at('Due')}: <bdi>${esc(task.due)}</bdi> · ${at('Priority')}: ${esc(tr(task.priority))}</div><div class="tiny task-meta">${at('Related event')}: ${linked?esc(linked.name):at('General task')}</div>${task.notes?ui`<p class="task-notes task-preview">${esc(task.notes)}</p>`:''}<div class="controls" style="margin:12px 0 0"><select aria-label="${at('Task status')}: ${esc(task.title)}" style="max-width:170px" onchange="setTaskStatus('${task.id}',this.value)">${['غير مكتمل','تحت العمل','مكتمل'].map(status=>option(status,status,task.status)).join('')}</select><button class="small-btn" type="button" onclick="taskDetails('${task.id}')">${at('View details')}</button><button class="small-btn" onclick="taskForm('${task.id}')">تعديل</button><button class="small-btn" onclick="deleteTask('${task.id}')">حذف</button></div></article>`;
  }).join('')}${!tasks.length?ui`<p class="muted">${at('No shared tasks yet.')}</p>`:''}</section>`,'إدارة مهام الفريق');
}
function taskDetails(id){
  const task=tasks.find(item=>item.id===id);if(!task)return;
  const linked=events.find(event=>event.id===task.event_id);
  modal(ui`<h3>${esc(task.title)}</h3><div class="row">${status(task.status)}${task.assignee_id===currentUser.id?ui`<span class="tag success">${at('Assigned to you')}</span>`:''}</div><dl class="task-detail-grid"><div><dt>${at('Assigned to')}</dt><dd>${esc(task.assignee_name||task.owner||at('Unassigned'))}</dd></div><div><dt>${at('Due')}</dt><dd><bdi>${esc(task.due)}</bdi></dd></div><div><dt>${at('Priority')}</dt><dd>${esc(tr(task.priority))}</dd></div><div><dt>${at('Related event')}</dt><dd>${linked?esc(linked.name):at('General task')}</dd></div></dl><h3>${at('Instructions & notes')}</h3><p class="task-notes">${esc(task.notes||at('No additional instructions.'))}</p><div class="controls">${linked?ui`<button type="button" class="btn secondary" onclick="closeModal();eventDetails('${linked.id}')">${at('Open linked event')}</button>`:''}<button type="button" class="btn secondary" onclick="closeModal()">${at('Close')}</button></div>`);
}
function taskForm(id){
  const task=tasks.find(item=>item.id===id)||{title:'',owner:'',due:iso(new Date()),priority:'متوسطة',status:'غير مكتمل',event_id:'',notes:'',assignee_id:null};
  const selected=task.assignee_id||(task.owner?'__legacy__':'');
  const keep=task.assignee_id&&!team.some(person=>person.id===task.assignee_id)?option(task.assignee_id,task.assignee_name||task.owner,selected,false):'';
  modal(ui`<h3>${tr(id?'تعديل المهمة':'إضافة مهمة')}</h3><form id="taskForm" onsubmit="submitTask(event,'${id||''}')"><div class="grid2"><div><label for="taskTitle">العنوان</label><input id="taskTitle" name="title" required maxlength="200" value="${esc(task.title)}"></div><div><label for="taskAssignee">${at('Assigned to')}</label><select id="taskAssignee" name="assignee_id">${option('',at('Unassigned'),selected,false)}${task.owner&&!task.assignee_id?option('__legacy__',task.owner,selected,false):''}${keep}${team.map(person=>option(person.id,person.name+' · '+roleLabel(person.role),selected,false)).join('')}</select><p class="tiny">${at('Everyone can see this task, including members who are not assigned to it.')}</p></div><div><label for="taskDue">تاريخ الاستحقاق</label><input id="taskDue" type="date" name="due" required value="${task.due}"></div><div><label for="taskPriority">الأولوية</label><select id="taskPriority" name="priority">${['منخفضة','متوسطة','عالية'].map(value=>option(value,value,task.priority)).join('')}</select></div><div><label for="taskStatus">الحالة</label><select id="taskStatus" name="status">${['غير مكتمل','تحت العمل','مكتمل'].map(value=>option(value,value,task.status)).join('')}</select></div><div><label for="taskEvent">الفعالية المرتبطة</label><select id="taskEvent" name="event_id">${option('',at('General task'),task.event_id,false)}${events.map(event=>option(event.id,event.name,task.event_id,false)).join('')}</select></div></div><label for="taskNotes">${at('Instructions & notes')}</label><textarea id="taskNotes" name="notes">${esc(task.notes)}</textarea><div class="controls"><button class="btn">حفظ</button><button type="button" class="btn secondary" onclick="closeModal()">إلغاء</button></div></form>`);
}
function taskValue(form){
  const id=form.assignee_id.value;
  const person=team.find(item=>item.id===id);
  const owner=id==='__legacy__'?form.assignee_id.selectedOptions[0].textContent:(person?.name||'');
  return {title:form.title.value,owner,due:form.due.value,priority:form.priority.value,status:form.status.value,event_id:form.event_id.value||null,notes:form.notes.value,assignee_id:id&&id!=='__legacy__'?id:null};
}
async function submitTask(e,id){e.preventDefault();try{await api('/tasks'+(id?'/'+id:''),id?'PUT':'POST',taskValue(e.target.elements));closeModal();await reload()}catch(x){alert(x.message)}}
async function setTaskStatus(id,s){let t=tasks.find(x=>x.id===id);try{await api('/tasks/'+id+'/status','PATCH',{status:s});await reload()}catch(e){alert(e.message)}}
async function deleteTask(id){if(confirm(tr('حذف المهمة؟'))){await api('/tasks/'+id,'DELETE');await reload()}}
function usersView(){
  setContent(ui`<section class="card"><div class="row"><div><h3>${at('Accounts & permissions')}</h3><p class="muted">${at('The leader controls access and assigns each account a role.')}</p></div><button class="btn" onclick="userForm()">+ ${at('Add account')}</button></div>${users.map(user=>ui`<div class="entry"><div class="row"><div><b>${esc(user.name)}</b><div class="tiny">${esc(user.email)} | ${esc(roleLabel(user.role))}</div></div><div class="account-tags"><span class="tag ${user.role==='admin'?'leader-badge':''}">${esc(roleLabel(user.role))}</span>${status(user.active?'نشط':'معطل')}${!user.has_login?ui`<span class="tag warning">${at('No login yet')}</span>`:''}</div></div><button class="small-btn" onclick="userForm('${user.id}')">${at('Edit account')}</button></div>`).join('')}</section><section class="card"><h3>${at('Role permissions')}</h3><div class="entry"><b>${at('Leader / Admin')}</b><p class="tiny">${at('Full access, account management, document approvals, and event closure.')}</p></div><div class="entry"><b>${at('Program Coordinator')}</b><p class="tiny">${at('Manage events, team tasks, and unapproved documents.')}</p></div><div class="entry"><b>${at('Team Member')}</b><p class="tiny">${at('View the workspace and update team task status.')}</p></div><div class="entry"><b>${at('Viewer')}</b><p class="tiny">${at('Read-only access to the workspace.')}</p></div></section>`,at('Accounts & permissions'));
}
function userForm(id){
  const user=users.find(item=>item.id===id)||{name:'',email:'',role:'member',active:1,has_login:false};
  modal(ui`<h3>${at(id?'Edit account':'Add account')}</h3><form onsubmit="submitUser(event,'${id||''}')"><div class="grid2"><div><label for="accountName">${at('Full name')}</label><input id="accountName" name="name" required maxlength="100" value="${esc(user.name)}" autocomplete="name"></div><div><label for="accountEmail">${at('Email address')}</label><input id="accountEmail" name="email" type="email" required maxlength="254" value="${esc(user.email)}" autocomplete="email"></div><div><label for="accountRole">${at('Role')}</label><select id="accountRole" name="role">${['admin','coordinator','member','viewer'].map(role=>option(role,roleLabel(role),user.role,false)).join('')}</select></div><div><label for="accountPassword">${at(id?'New password (optional)':'Password')}</label><input id="accountPassword" name="password" type="password" minlength="8" maxlength="128" ${id?'':'required'} autocomplete="new-password"><p class="tiny">${at(id?'Leave blank to keep the current password. Setting a password enables login and signs out existing sessions.':'Use at least 8 characters. Share the password privately with the account owner.')}</p></div></div><label style="margin:14px 0"><input class="check" name="active" type="checkbox" ${user.active?'checked':''}> ${at('Active account')}</label><div class="controls"><button class="btn">${at('Save account')}</button><button type="button" class="btn secondary" onclick="closeModal()">${at('Cancel')}</button></div></form>`);
}
async function submitUser(event,id){
  event.preventDefault();const form=event.target.elements;const button=event.submitter;button.disabled=true;
  try{await api('/users'+(id?'/'+id:''),id?'PUT':'POST',{name:form.name.value,email:form.email.value,role:form.role.value,active:form.active.checked,password:form.password.value});closeModal();await reload()}catch(error){alert(error.message)}finally{button.disabled=false}
}
function render(){if(view==='users'&&!isLeader())view='dashboard';if(view==='dashboard')dashboard();if(view==='calendar')calendar();if(view==='events')eventsView();if(view==='documents')documents().catch(e=>alert(e.message));if(view==='tasks')tasksView();if(view==='users')usersView();applyPermissions()}
let connectionError=null;
function showConnectionError(error){connectionError=error;setContent(ui`<div class="notice">تعذر الاتصال بخادم التطبيق: ${esc(tr(error.message))}</div>`,'خطأ في الاتصال')}
applyLanguage();
$('#languageToggle').addEventListener('click',()=>setLanguage(language==='ar'?'en':'ar'));
window.addEventListener('DOMContentLoaded',()=>{applyLanguage();reload().catch(showConnectionError)});
</script><script src="./assets/workspace-auth.js"></script><script src="./assets/workspace-sync.js"></script></body></html>
